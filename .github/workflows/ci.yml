# CI：类型检查 + Lint + 生产构建（带 PostgreSQL service，覆盖会查库的预渲染页面）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRISMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_platform_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_platform_test?schema=public
      # CI 专用占位值，不用于任何真实环境
      JWT_SECRET: ci-only-placeholder-secret-not-for-production-use
      IP_HASH_SALT: ci-only-salt
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
